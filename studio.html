<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gary's Design</title>
  <style>
    :root {
      --bg: oklch(99% 0.002 240);
      --surface: oklch(100% 0 0);
      --fg: oklch(22% 0.015 250);
      --muted: oklch(49% 0.015 250);
      --border: oklch(91% 0.006 250);
      --accent: oklch(61% 0.07 229);
      --accent-strong: oklch(50% 0.095 229);
      --ink: oklch(17% 0.012 250);
      --dark: oklch(24% 0.024 250);
      --dark-muted: oklch(77% 0.012 245);
      --soft: oklch(96% 0.006 240);
      --success: oklch(59% 0.11 155);
      --warn: oklch(70% 0.13 78);
      --danger: oklch(58% 0.16 25);
      --font-display: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-body: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      --content: min(1160px, calc(100vw - 40px));
      --radius: 8px;
      --site-bg-image: url("/assets/portfolio/site-classroom-bg.jpg");
      --hero-cover-image:
        linear-gradient(135deg, rgba(20, 33, 61, 0.5), rgba(17, 24, 39, 0.18)),
        url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1600&q=80");
      --featured-visual-image:
        linear-gradient(135deg, color-mix(in oklch, var(--accent) 70%, white), oklch(30% 0.04 250)),
        var(--soft);
    }

    * { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
    }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.68), rgba(255, 255, 255, 0.78)),
        linear-gradient(120deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02)),
        var(--site-bg-image) center / cover fixed no-repeat;
      color: var(--fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      line-height: 1.55;
      position: relative;
    }
    body.studio-locked {
      overflow: hidden;
      height: 100vh;
    }
    body.studio-locked #appShell {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      max-height: 0 !important;
      overflow: hidden !important;
    }
    body.modal-open { overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .68; }
    img { max-width: 100%; display: block; }
    :focus-visible {
      outline: 3px solid color-mix(in oklch, var(--accent) 72%, white);
      outline-offset: 4px;
    }
    body[data-mode="viewer"] .studio-only { display: none !important; }
    body[data-mode="studio"] .viewer-only { display: none !important; }

    .skip-link {
      position: fixed;
      left: 16px;
      top: 14px;
      z-index: 80;
      transform: translateY(-140%);
      background: var(--fg);
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: .86rem;
      font-weight: 700;
      transition: transform .15s ease;
    }
    .skip-link:focus-visible { transform: translateY(0); }

    .site-nav {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.66);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }
    .nav-inner {
      width: var(--content);
      min-height: 74px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
    }
    .brand-mark {
      width: 11px;
      height: 11px;
      background: var(--accent);
      display: inline-block;
      transform: rotate(45deg);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: .9rem;
      color: var(--muted);
    }
    .nav-links a:hover,
    .nav-links a[aria-current="page"] { color: var(--fg); }
    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .menu-toggle {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      border-radius: 999px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      font-size: .84rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .mobile-menu {
      width: var(--content);
      margin: 0 auto;
      display: none;
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 0 0 16px;
    }
    .mobile-menu.is-open { display: grid; }
    .mobile-link {
      min-height: 48px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-weight: 600;
    }
    .nav-action, .btn-primary, .btn-secondary, .btn-danger, .btn-ghost {
      border: 1px solid var(--fg);
      background: var(--fg);
      color: white;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .nav-action:hover,
    .btn-primary:hover,
    .btn-secondary:hover,
    .btn-danger:hover,
    .btn-ghost:hover {
      transform: translateY(-1px);
    }
    .btn-secondary,
    .btn-ghost {
      background: transparent;
      color: var(--fg);
      border-color: var(--border);
    }
    .btn-secondary:hover,
    .btn-ghost:hover { border-color: var(--fg); }
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border-color: color-mix(in oklch, var(--danger) 34%, var(--border));
    }
    .btn-danger:hover { border-color: var(--danger); }

    .host-banner {
      width: var(--content);
      margin: 18px auto 0;
      border: 1px solid color-mix(in oklch, var(--accent) 24%, var(--border));
      background: rgba(248, 251, 255, 0.82);
      padding: 14px 18px;
      display: grid;
      gap: 6px;
    }
    .host-banner strong { font-size: .96rem; }
    .host-banner p {
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
    }

    .hero {
      width: var(--content);
      margin: 0 auto;
      padding: clamp(52px, 9vw, 112px) 0 clamp(36px, 6vw, 78px);
      display: grid;
      gap: 42px;
    }
    .hero-banner {
      position: relative;
      min-height: clamp(280px, 38vw, 460px);
      display: grid;
      place-items: center;
      padding: clamp(28px, 5vw, 44px);
      overflow: hidden;
      border: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(255,255,255,.1), rgba(8, 12, 24, .26)),
        var(--hero-cover-image);
      background-size: cover;
      background-position: center;
      isolation: isolate;
    }
    .hero-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.28)),
        linear-gradient(120deg, rgba(255,255,255,.16), transparent 38%);
      z-index: -1;
    }
    .hero-title {
      text-align: center;
      margin: 0;
      color: white;
      font-family: var(--font-display);
      font-size: clamp(64px, 14vw, 190px);
      line-height: .86;
      font-weight: 800;
      letter-spacing: -0.025em;
      text-shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
    }
    .hero-title span {
      color: transparent;
      -webkit-text-stroke: 2px rgba(255,255,255,.95);
      text-stroke: 2px rgba(255,255,255,.95);
    }
    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(280px, .75fr);
      gap: clamp(28px, 5vw, 64px);
      align-items: end;
    }
    .intro h1 {
      font-size: clamp(32px, 5vw, 64px);
      line-height: 1.02;
      margin: 0 0 18px;
      max-width: 12ch;
      color: var(--fg);
      font-weight: 700;
      letter-spacing: -0.018em;
    }
    .intro p {
      margin: 0;
      max-width: 62ch;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 21px);
    }
    .author-card {
      padding: 22px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      display: grid;
      gap: 16px;
    }
    .portrait {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 42% 32%, oklch(86% 0.03 230) 0 18%, transparent 19%),
        linear-gradient(135deg, oklch(72% 0.055 226), oklch(42% 0.045 250));
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
    }
    .portrait::after {
      content: "";
      position: absolute;
      left: 19px;
      right: 19px;
      bottom: 0;
      height: 38px;
      border-radius: 24px 24px 0 0;
      background: var(--fg);
    }
    .portrait.has-image::after { display: none; }
    .author-card h2,
    .author-card h3,
    .author-card p { margin: 0; }
    .author-card h2 { font-size: 1.2rem; }
    .author-card h3 {
      font-size: .8rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent-strong);
      font-family: var(--font-mono);
    }
    .author-card p { color: var(--muted); font-size: .95rem; }

    .studio-panel {
      width: var(--content);
      margin: 0 auto 42px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      padding: clamp(22px, 4vw, 34px);
      display: grid;
      gap: 24px;
    }
    .studio-panel h2,
    .studio-panel h3 {
      margin: 0;
      line-height: 1.05;
    }
    .studio-panel p {
      margin: 0;
      color: var(--muted);
    }
    .studio-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .field {
      display: grid;
      gap: 7px;
    }
    .field.wide { grid-column: 1 / -1; }
    .field label {
      font-size: .86rem;
      font-weight: 700;
    }
    .field small {
      color: var(--muted);
      font-size: .82rem;
    }
    input, textarea, select {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
      color: var(--fg);
      padding: 12px 14px;
    }
    textarea {
      min-height: 130px;
      resize: vertical;
    }
    input[type="file"] {
      padding: 10px 12px;
    }
    .asset-controls {
      display: grid;
      gap: 10px;
    }
    .asset-preview {
      min-height: 86px;
      border: 1px dashed var(--border);
      background: var(--soft);
      display: grid;
      place-items: center;
      padding: 14px;
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
    }
    .asset-preview.has-image {
      background-size: cover;
      background-position: center;
      color: transparent;
    }
    .asset-preview.has-video {
      padding: 0;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.92);
      color: transparent;
    }
    .asset-preview-media {
      display: block;
      width: 100%;
      min-height: 86px;
      max-height: 260px;
      object-fit: cover;
      background: #000;
    }
    .asset-actions,
    .form-actions,
    .host-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .message {
      min-height: 1.3em;
      color: var(--muted);
      font-size: .9rem;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: .9rem;
    }
    .toggle input {
      width: 18px;
      min-height: 18px;
      margin: 0;
      padding: 0;
    }

    .toolbar-wrap {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .toolbar {
      width: var(--content);
      margin: 0 auto;
      padding: 18px 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
    }
    .toolbar-meta {
      display: grid;
      gap: 10px;
    }
    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0 16px;
      min-height: 46px;
      background: rgba(255, 255, 255, 0.56);
    }
    .search-label {
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .search input {
      width: 100%;
      min-height: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--fg);
    }
    .result-summary {
      color: var(--muted);
      font-size: .88rem;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .filter {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border-radius: 999px;
      color: var(--muted);
    }
    .filter[aria-pressed="true"] {
      color: white;
      background: var(--fg);
      border-color: var(--fg);
    }

    .featured {
      width: var(--content);
      margin: 42px auto 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, .9fr);
      min-height: 520px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
    }
    .visual {
      min-height: 320px;
      background: var(--featured-visual-image);
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
    }
    .visual-media-asset {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 0;
    }
    .visual::before {
      content: "";
      position: absolute;
      inset: 11%;
      border: 1px solid rgba(255,255,255,.65);
      background:
        linear-gradient(90deg, rgba(255,255,255,.82) 0 34%, transparent 34% 40%, rgba(255,255,255,.68) 40% 100%);
      transform: rotate(-4deg);
      box-shadow: 0 28px 60px rgba(0,0,0,.2);
    }
    .visual.has-image::before {
      inset: auto 22px 22px 22px;
      height: 80px;
      transform: none;
      border: 0;
      background: linear-gradient(180deg, transparent, rgba(8, 12, 24, 0.74));
      box-shadow: none;
    }
    .visual.has-video::before {
      inset: auto 22px 22px 22px;
      height: 104px;
      transform: none;
      border: 0;
      background: linear-gradient(180deg, transparent, rgba(8, 12, 24, 0.78));
      box-shadow: none;
    }
    .visual::after {
      content: "learning path";
      position: absolute;
      left: 14%;
      bottom: 16%;
      padding: 9px 12px;
      background: var(--fg);
      color: white;
      border-radius: 999px;
      font: 700 12px/1 var(--font-mono);
      text-transform: uppercase;
      letter-spacing: .08em;
      z-index: 1;
    }
    .featured-copy {
      padding: clamp(28px, 5vw, 58px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
    }
    .eyebrow {
      color: var(--accent-strong);
      font: 700 .74rem/1 var(--font-mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .featured h2 {
      margin: 0;
      font-size: clamp(34px, 5vw, 68px);
      line-height: 1.02;
      letter-spacing: -0.018em;
      max-width: 10ch;
    }
    .featured p { margin: 0; color: var(--muted); font-size: 1.03rem; }

    .posts {
      margin-top: 54px;
      border-top: 1px solid var(--border);
    }
    .post-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      min-height: 430px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
    }
    .post-row.is-dark {
      background: var(--dark);
      color: white;
    }
    .post-row.is-dark .post-meta,
    .post-row.is-dark .post-excerpt,
    .post-row.is-dark .author-line,
    .post-row.is-dark .open-post,
    .post-row.is-dark .host-actions .btn-ghost {
      color: var(--dark-muted);
    }
    .post-row.is-dark .open-post,
    .post-row.is-dark .host-actions .btn-ghost,
    .post-row.is-dark .host-actions .btn-danger {
      border-color: rgba(255,255,255,.28);
    }
    .post-row:nth-child(even) .post-media { order: 2; }
    .post-media {
      min-height: 430px;
      background: var(--soft);
      position: relative;
      overflow: hidden;
    }
    .post-media-frame,
    .dialog-media-card {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: color-mix(in oklch, var(--dark) 86%, black);
    }
    .post-media-frame img,
    .post-media-frame video,
    .dialog-media-card img,
    .dialog-media-card video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .post-media-stack {
      position: absolute;
      inset: auto 22px 22px 22px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      z-index: 2;
    }
    .post-media-stack p {
      margin: 0;
      max-width: 24ch;
      color: white;
      font-size: .95rem;
      text-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .post-media[data-kind="Article"] {
      background:
        linear-gradient(90deg, transparent 0 18%, rgba(255,255,255,.75) 18% 20%, transparent 20%),
        linear-gradient(135deg, oklch(93% 0.012 245), oklch(77% 0.03 226));
    }
    .post-media[data-kind="Pictures"] {
      background:
        radial-gradient(circle at 70% 28%, oklch(82% 0.06 185) 0 16%, transparent 17%),
        linear-gradient(135deg, oklch(88% 0.02 228), oklch(64% 0.07 230));
    }
    .post-media[data-kind="Video"] {
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.86) 0 8%, transparent 9%),
        conic-gradient(from 130deg at 50% 50%, oklch(72% 0.08 230), oklch(32% 0.035 248), oklch(72% 0.08 230));
    }
    .post-media[data-kind="Mixed"] {
      background:
        linear-gradient(45deg, rgba(255,255,255,.7) 0 12%, transparent 12% 24%, rgba(255,255,255,.45) 24% 36%, transparent 36%),
        linear-gradient(135deg, oklch(84% 0.035 205), oklch(44% 0.05 250));
    }
    .media-badge {
      position: absolute;
      top: 28px;
      left: 28px;
      background: rgba(255,255,255,.88);
      color: var(--fg);
      padding: 8px 12px;
      border-radius: 999px;
      font: 700 .74rem/1 var(--font-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .post-content {
      padding: clamp(28px, 5vw, 64px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }
    .post-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--muted);
      font-size: .82rem;
    }
    .post-title {
      margin: 0;
      font-size: clamp(28px, 4vw, 52px);
      line-height: 1.06;
      max-width: 14ch;
    }
    .post-excerpt {
      margin: 0;
      color: var(--muted);
      max-width: 58ch;
    }
    .post-excerpt + .post-excerpt {
      margin-top: 0.9rem;
    }
    .dialog-copy {
      display: grid;
      gap: 1rem;
    }
    .dialog-paragraph {
      margin: 0;
    }
    .author-line {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: .9rem;
    }
    .mini-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), oklch(35% 0.04 250));
      background-size: cover;
      background-position: center;
    }
    .open-post {
      align-self: flex-start;
      min-height: 44px;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--fg);
    }
    .post-row.is-new {
      animation: new-post-flash 1.2s ease;
    }
    @keyframes new-post-flash {
      0% { background: color-mix(in oklch, var(--accent) 16%, var(--surface)); }
      100% { background: transparent; }
    }
    .host-actions { margin-top: 2px; }
    .host-actions .btn-ghost,
    .host-actions .btn-danger {
      min-height: 38px;
      padding: 0 14px;
      font-size: .9rem;
    }

    .creator {
      width: var(--content);
      margin: clamp(50px, 8vw, 88px) auto;
      display: grid;
      grid-template-columns: minmax(0, .8fr) minmax(320px, 1fr);
      gap: 34px;
      align-items: start;
    }
    .creator h2, .contact h2 {
      margin: 0 0 14px;
      font-size: clamp(30px, 5vw, 56px);
      line-height: 1.05;
      letter-spacing: -0.018em;
    }
    .creator p, .contact p { color: var(--muted); margin: 0; }
    .composer {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: clamp(22px, 4vw, 34px);
      display: grid;
      gap: 16px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .attachment-preview {
      display: grid;
      gap: 10px;
      min-height: 58px;
      padding: 12px 14px;
      border: 1px dashed var(--border);
      background: var(--soft);
      color: var(--muted);
      font-size: .9rem;
    }
    .attachment-preview.is-empty {
      place-items: center;
      text-align: center;
    }
    .summary-help {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: .88rem;
    }
    .attachment-item {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
    }
    .attachment-item strong,
    .attachment-item span {
      display: block;
    }
    .attachment-item span:last-child {
      white-space: nowrap;
    }
    .attachment-tag,
    .post-media-count {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,.2);
      color: white;
      border-radius: 999px;
      padding: 6px 10px;
      font: 700 .72rem/1 var(--font-mono);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .attachment-preview .attachment-tag {
      background: color-mix(in oklch, var(--accent) 14%, white);
      color: var(--fg);
    }
    .post-summary-flow,
    .dialog-copy {
      display: grid;
      gap: 16px;
    }
    .inline-media-card,
    .dialog-inline-media {
      margin: 0;
      display: grid;
      gap: 10px;
    }
    .inline-media-card img,
    .inline-media-card video,
    .dialog-inline-media img,
    .dialog-inline-media video,
    .dialog-hero-asset {
      width: 100%;
      border-radius: 18px;
      border: 1px solid var(--border);
      object-fit: cover;
      background: rgba(12, 20, 36, 0.08);
    }
    .inline-media-card figcaption,
    .dialog-inline-media figcaption {
      color: var(--muted);
      font-size: .82rem;
    }
    .dialog-hero-media {
      margin-bottom: 16px;
    }

    .empty {
      width: var(--content);
      margin: 34px auto;
      border: 1px dashed var(--border);
      background: var(--surface);
      padding: 28px;
      display: grid;
      gap: 10px;
    }

    .contact {
      border-top: 1px solid var(--border);
      padding: 34px 0 50px;
    }
    .contact-inner {
      width: var(--content);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
    }
    .contact-links {
      display: grid;
      gap: 8px;
      justify-items: start;
      text-align: left;
    }
    .contact-links a,
    .contact-links span {
      min-height: 24px;
      color: var(--fg);
    }
    .contact-links .muted-link { color: var(--muted); }

    .dialog {
      position: fixed;
      inset: 0;
      background: rgba(10, 14, 24, 0.55);
      display: none;
      place-items: center;
      z-index: 50;
      padding: 22px;
    }
    .dialog.is-open { display: grid; }
    .dialog-panel {
      width: min(780px, 100%);
      max-height: min(820px, 90vh);
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 24px 80px rgba(0,0,0,.28);
    }
    .dialog-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 22px 24px;
      border-bottom: 1px solid var(--border);
    }
    .dialog-head h3 { margin: 0; font-size: 1.5rem; }
    .close {
      width: 44px;
      min-height: 44px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
    }
    .dialog-body { padding: 24px 26px 30px; display: grid; gap: 18px; }
    .dialog-body p { color: var(--muted); margin: 0; }
    .embed-box {
      display: grid;
      gap: 14px;
      border: 1px solid var(--border);
      background: var(--soft);
      padding: 18px;
    }
    .dialog-media-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .dialog-media-card {
      aspect-ratio: 16 / 10;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .dialog-media-link {
      color: var(--accent-strong);
      word-break: break-word;
    }

    .auth-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }
    .auth-card {
      width: min(460px, 100%);
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 30px;
      display: grid;
      gap: 18px;
    }
    .auth-card h1,
    .auth-card p {
      margin: 0;
    }
    .auth-card p { color: var(--muted); }

    @media (max-width: 860px) {
      .nav-links,
      .nav-controls .viewer-only { display: none; }
      .menu-toggle { display: inline-flex; }
      .hero-grid,
      .featured,
      .creator,
      .contact-inner,
      .toolbar,
      .studio-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }
      .filters { justify-content: flex-start; }
      .post-row {
        grid-template-columns: 1fr;
      }
      .post-row:nth-child(even) .post-media { order: 0; }
    }
    @media (max-width: 640px) {
      :root { --content: min(100vw - 24px, 1160px); }
      .hero-title { font-size: clamp(58px, 22vw, 94px); }
      .hero-title span {
        -webkit-text-stroke-width: 1px;
        text-stroke-width: 1px;
      }
      .nav-controls { width: 100%; justify-content: flex-end; }
      .post-content,
      .featured-copy,
      .studio-panel,
      .composer,
      .dialog-body,
      .dialog-head,
      .auth-card {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body class="studio-locked">
  <a class="skip-link" href="#posts">Skip to posts</a>

  <div id="studioAuth" class="auth-shell studio-only" hidden>
    <form class="auth-card" id="authForm">
      <div class="eyebrow" id="authEyebrow">Host access</div>
      <h1 id="authTitle">Unlock the host studio</h1>
      <p id="authCopy">Enter the host passcode to open the studio. This is now checked by the live backend before any editing tools are shown.</p>
      <div class="field">
        <label for="authPasscode" id="authLabel">Passcode</label>
        <input id="authPasscode" type="password" autocomplete="current-password" required />
      </div>
      <div class="field" id="authConfirmWrap" hidden>
        <label for="authConfirm">Confirm passcode</label>
        <input id="authConfirm" type="password" autocomplete="new-password" />
      </div>
      <div class="message" id="authMessage" role="status" aria-live="polite"></div>
      <div class="form-actions">
        <button class="btn-primary" type="submit" id="authSubmit">Continue</button>
      </div>
    </form>
  </div>

  <template id="studioAppTemplate">
  <div id="appShell" hidden inert aria-hidden="true">
    <nav class="site-nav" aria-label="Primary navigation">
      <div class="nav-inner">
        <a href="#home" class="brand" aria-label="Gary's Design home"><span class="brand-mark"></span> <span id="brandLabel">Gary's Design</span></a>
        <div class="nav-links">
          <a href="#posts" aria-current="page">Posts</a>
          <a href="#contact">Contact</a>
          <a href="#studio" class="studio-only">Studio</a>
        </div>
        <div class="nav-controls">
          <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobileMenu" data-menu-toggle>Menu</button>
          <a class="nav-action studio-only" href="#create">New post</a>
        </div>
      </div>
      <div class="mobile-menu" id="mobileMenu">
        <a class="mobile-link" href="#posts">Posts</a>
        <a class="mobile-link" href="#contact">Contact</a>
        <a class="mobile-link studio-only" href="#studio">Studio</a>
        <a class="mobile-link studio-only" href="#create">New post</a>
      </div>
    </nav>

    <section class="host-banner studio-only" aria-label="Host-only editing note">
      <strong>Host studio</strong>
      <p>This page is the editing surface. The public-facing version is `index.html`, while `studio.html` stays for you as the host. Changes here are intended to save to the live CMS and update the public portfolio feed.</p>
    </section>

    <main id="home">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-banner" id="heroBanner" aria-label="Cover image behind Gary's Design title">
          <h1 class="hero-title" id="heroTitle">Gary's <span>Design</span></h1>
        </div>
        <div class="hero-grid">
          <div class="intro">
            <h1 id="introHeading">Instructional design work, written and shown.</h1>
            <p id="introCopy">A simple publishing home for learning articles, process images, demo videos, and complete case-study posts.</p>
          </div>
          <aside class="author-card" aria-label="Author profile">
            <div class="portrait" id="profilePortrait" aria-hidden="true"></div>
            <div>
              <h3 id="profileName">Gary</h3>
              <h2 id="profileRole">Instructional Designer</h2>
              <p id="profileBio">Use this space for your specialty, your point of view, and the kinds of learning problems you solve.</p>
            </div>
          </aside>
        </div>
      </section>

      <section class="studio-panel studio-only" id="studio" aria-labelledby="studio-title">
        <div>
          <div class="eyebrow">Page editor</div>
          <h2 id="studio-title">Edit the page outside the posts.</h2>
          <p>Use this form to update the public copy, cover image, profile photo, featured module, contact details, and the host passcode for the studio surface.</p>
        </div>
        <form id="siteForm">
          <div class="studio-grid">
            <div class="field">
              <label for="siteTitle">Site title</label>
              <input id="siteTitle" name="siteTitle" />
            </div>
            <div class="field">
              <label for="profileNameInput">Profile label</label>
              <input id="profileNameInput" name="profileName" />
            </div>
            <div class="field wide">
              <label for="introHeadingInput">Hero heading</label>
              <input id="introHeadingInput" name="introHeading" />
            </div>
            <div class="field wide">
              <label for="introCopyInput">Hero description</label>
              <textarea id="introCopyInput" name="introCopy"></textarea>
            </div>
            <div class="field">
              <label for="profileRoleInput">Profile role</label>
              <input id="profileRoleInput" name="profileRole" />
            </div>
            <div class="field wide">
              <label for="profileBioInput">Profile description</label>
              <textarea id="profileBioInput" name="profileBio"></textarea>
            </div>
            <div class="field wide">
              <label>Hero cover photo</label>
              <div class="asset-controls">
                <input id="heroCoverUrlInput" name="heroCoverUrl" placeholder="Paste an image URL if you prefer linking instead of uploading" />
                <input id="heroCoverFileInput" type="file" accept="image/*" />
                <div class="asset-preview" id="heroCoverPreview">Current hero cover preview</div>
                <div class="asset-actions">
                  <button class="btn-ghost" type="button" data-clear-asset="heroCover">Remove hero cover</button>
                </div>
              </div>
            </div>
            <div class="field wide">
              <label>Profile picture</label>
              <div class="asset-controls">
                <input id="profileImageUrlInput" name="profileImageUrl" placeholder="Paste an image URL if you prefer linking instead of uploading" />
                <input id="profileImageFileInput" type="file" accept="image/*" />
                <div class="asset-preview" id="profileImagePreview">Current profile image preview</div>
                <div class="asset-actions">
                  <button class="btn-ghost" type="button" data-clear-asset="profileImage">Remove profile image</button>
                </div>
              </div>
            </div>
            <div class="field">
              <label for="featuredEyebrowInput">Featured eyebrow</label>
              <input id="featuredEyebrowInput" name="featuredEyebrow" />
            </div>
            <div class="field">
              <label for="featuredTitleInput">Featured title</label>
              <input id="featuredTitleInput" name="featuredTitle" />
            </div>
            <div class="field wide">
              <label for="featuredCopyInput">Featured description</label>
              <textarea id="featuredCopyInput" name="featuredCopy"></textarea>
              <small>Paste images or videos directly into this field. They will appear only inside the opened featured story, not on the outside panel.</small>
              <div class="attachment-preview is-empty" id="featuredInlineMediaPreview">Paste images or videos into the featured description to embed them inside the opened story.</div>
            </div>
            <div class="field">
              <label for="featuredMediaInput">Featured media note</label>
              <input id="featuredMediaInput" name="featuredMedia" />
            </div>
            <div class="field wide">
              <label>Featured image or video</label>
              <div class="asset-controls">
                <input id="featuredImageUrlInput" name="featuredImageUrl" placeholder="Paste an image or video URL if you prefer linking instead of uploading" />
                <input id="featuredImageFileInput" type="file" accept="image/*,video/*" />
                <div class="asset-preview" id="featuredImagePreview">Current featured media preview</div>
                <div class="asset-actions">
                  <button class="btn-ghost" type="button" data-clear-asset="featuredImage">Remove featured media</button>
                </div>
              </div>
            </div>
            <div class="field">
              <label for="contactHeadingInput">Contact heading</label>
              <input id="contactHeadingInput" name="contactHeading" />
            </div>
            <div class="field">
              <label for="contactEmailInput">Email</label>
              <input id="contactEmailInput" name="contactEmail" />
            </div>
            <div class="field wide">
              <label for="contactCopyInput">Contact description</label>
              <textarea id="contactCopyInput" name="contactCopy"></textarea>
            </div>
            <div class="field">
              <label for="linkedinLabelInput">LinkedIn label</label>
              <input id="linkedinLabelInput" name="linkedinLabel" />
            </div>
            <div class="field">
              <label for="linkedinUrlInput">LinkedIn URL</label>
              <input id="linkedinUrlInput" name="linkedinUrl" placeholder="https://..." />
            </div>
            <div class="field">
              <label for="newPasscodeInput">New studio passcode</label>
              <input id="newPasscodeInput" name="newPasscode" type="password" autocomplete="new-password" />
              <small>Leave this blank if you do not want to change the studio passcode.</small>
            </div>
          </div>
          <div class="message" id="siteMessage" role="status" aria-live="polite"></div>
          <div class="form-actions">
            <button class="btn-primary" type="submit">Save page changes</button>
          </div>
        </form>
      </section>

      <section class="toolbar-wrap" aria-label="Post filters">
        <div class="toolbar">
          <div class="toolbar-meta">
            <label class="search" for="searchInput">
              <span class="search-label">Search</span>
              <input id="searchInput" type="search" placeholder="Find by topic, format, or audience" autocomplete="off" />
            </label>
            <div class="result-summary" id="resultSummary" aria-live="polite">Showing all portfolio entries.</div>
          </div>
          <div class="filters" id="filters" aria-label="Filter by format">
            <button class="filter" type="button" data-filter="All" aria-pressed="true">All</button>
            <button class="filter" type="button" data-filter="Article" aria-pressed="false">Articles</button>
            <button class="filter" type="button" data-filter="Pictures" aria-pressed="false">Pictures</button>
            <button class="filter" type="button" data-filter="Video" aria-pressed="false">Videos</button>
            <button class="filter" type="button" data-filter="Mixed" aria-pressed="false">Mixed</button>
          </div>
        </div>
      </section>

      <section class="featured" aria-labelledby="featuredTitle">
        <div class="visual" id="featuredVisual" aria-hidden="true"></div>
        <div class="featured-copy">
          <div class="eyebrow" id="featuredEyebrow">Featured case study</div>
          <h2 id="featuredTitle">From course notes to learner pathway.</h2>
          <p id="featuredCopy">Lead with a strong piece that combines article writing, screenshots, and a short walkthrough video.</p>
          <button class="btn-secondary" type="button" id="featuredButton">Open featured story</button>
        </div>
      </section>

      <section class="posts" id="posts" aria-live="polite"></section>

      <section class="creator studio-only" id="create" aria-labelledby="create-title">
        <div>
          <div class="eyebrow">Content studio</div>
          <h2 id="create-title">Create, edit, or remove portfolio posts.</h2>
          <p>New posts appear in the public feed preview here. When you edit a post, its title, summary, media, and attachments all become editable. Deleting removes it from the saved studio data in this browser.</p>
        </div>
        <form class="composer" id="postForm">
          <input id="editingPostId" type="hidden" />
          <div class="field">
            <label for="postTitle">Title</label>
            <input id="postTitle" name="title" placeholder="e.g. Building a scenario-based onboarding module" required />
          </div>
          <div class="form-grid">
            <div class="field">
              <label for="postKind">Format</label>
              <select id="postKind" name="kind">
                <option>Article</option>
                <option>Pictures</option>
                <option>Video</option>
                <option>Mixed</option>
              </select>
            </div>
            <div class="field">
              <label for="postAudience">Audience</label>
              <input id="postAudience" name="audience" placeholder="New hires, sales team, students" />
            </div>
          </div>
          <div class="field">
            <label for="postSummary">Summary</label>
            <textarea id="postSummary" name="summary" placeholder="Describe the learning problem, your design approach, and what the viewer should notice." required></textarea>
          </div>
          <div class="field">
            <label for="postMedia">Supporting media link or note</label>
            <input id="postMedia" name="media" placeholder="Optional URL, caption, or context for the attached media" />
          </div>
          <div class="field">
            <label for="postCoverFile">Featured cover image or video</label>
            <input id="postCoverFile" name="coverFile" type="file" accept="image/*,video/*" />
            <small>This becomes the main cover shown on the post card and at the top of the full post view.</small>
            <div class="attachment-preview is-empty" id="postCoverPreview">No featured cover selected yet.</div>
          </div>
          <div class="field">
            <label for="postSummary">Inline visual aids inside the summary</label>
            <small>Copy and paste images or videos directly into the summary field. They will be embedded where you paste them on the live post.</small>
            <div class="attachment-preview is-empty" id="inlineMediaPreview">Paste images or videos into the summary field to embed them inline.</div>
          </div>
          <div class="field">
            <label for="postFiles">Additional images or videos</label>
            <input id="postFiles" name="files" type="file" accept="image/*,video/*" multiple />
            <small>Optional extra media. If not pasted inline, these appear after the written content in the full post view.</small>
            <div class="attachment-preview is-empty" id="attachmentPreview">No files selected yet.</div>
          </div>
          <label class="toggle" id="removeAttachmentsWrap" hidden>
            <input id="removeAttachments" type="checkbox" />
            Remove existing attachments from this post
          </label>
          <div class="message" id="formMessage" role="status" aria-live="polite"></div>
          <div class="form-actions">
            <button class="btn-primary" type="submit" id="publishButton">Publish post</button>
            <button class="btn-secondary" type="button" id="cancelEditButton" hidden>Cancel edit</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="contact" id="contact">
      <div class="contact-inner">
        <div>
          <div class="eyebrow">Contact</div>
          <h2 id="contactHeading">Invite the work into a conversation.</h2>
          <p id="contactCopy">Use this footer for your email, LinkedIn, and a short note about the kinds of learning design projects you want to take on next.</p>
        </div>
        <div class="contact-links">
          <a id="contactEmailLink" href="mailto:hello@example.com">hello@example.com</a>
          <a id="linkedinLink" class="muted-link" href="#" target="_blank" rel="noreferrer">LinkedIn profile URL</a>
        </div>
      </div>
    </footer>

    <div class="dialog" id="postDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <article class="dialog-panel">
        <div class="dialog-head">
          <h3 id="dialogTitle">Post title</h3>
          <button class="close" type="button" aria-label="Close dialog" data-close-dialog>&times;</button>
        </div>
        <div class="dialog-body" id="dialogBody"></div>
      </article>
    </div>
  </div>
  </template>
  <div id="studioMount" aria-live="off"></div>

  <script src="assets/portfolio-app.js?v=20260801b"></script>
